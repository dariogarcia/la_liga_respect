# F1: deploy the static site (index.html + data/ + assets/) to GitHub
# Pages on every push to main. Requires one manual step: repo Settings ->
# Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Only the site itself is published; source code and tests stay out.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/data
          cp -r assets _site/assets

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
