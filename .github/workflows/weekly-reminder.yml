# A1 (reminder-only variant): the full pipeline needs the LLM API key,
# which only exists in the owner's local environment. GitHub Actions
# cannot run collection/grading, so this workflow's only job is to open
# a weekly issue reminding the owner to run the update locally. It
# never needs secrets and never touches data.
name: Weekly update reminder

on:
  schedule:
    # Mondays 09:00 UTC (after the weekend's matchdays).
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: weekly-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open weekly update issue (if none is open)
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = 'weekly-update';

            // Make sure the label exists (idempotent).
            try {
              await github.rest.issues.createLabel({ owner, repo, name: label });
            } catch (e) {
              // 422 = already exists; anything else is a real error.
              if (e.status !== 422) throw e;
            }

            // Only one open reminder at a time: the previous week's
            // issue is closed when the update is pushed.
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label,
            });
            if (open.data.length > 0) {
              core.info(
                `Open ${label} issue already exists (#${open.data[0].number}); ` +
                'last week\'s update may still be pending. Skipping.'
              );
              return;
            }

            const today = new Date().toISOString().slice(0, 10);
            const body = [
              'Weekly data update due (reminder opened automatically).',
              '',
              'Run locally with the LLM API key configured:',
              '',
              '1. `python3 src/main.py` — calendar sync, collection, grading, re-ranking',
              '2. Review the Collection and Grading reports for anomalies',
              '3. If transient failures: `python3 src/main.py --retry-pending` once',
              '4. `python3 -m unittest discover -s tests -t .`',
              '5. Commit updated `data/` and push to `main`',
              '6. Close this issue',
              '',
              `_Reminder date: ${today}_`,
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner, repo, title: `Weekly data update (week of ${today})`, body, labels: [label],
            });
            core.info(`Created reminder issue #${issue.data.number}.`);
