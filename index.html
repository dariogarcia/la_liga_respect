<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respect Rank - La Liga</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #1a3a5a;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }
        .description {
            text-align: center;
            max-width: 600px;
            margin-bottom: 30px;
            color: #666;
            font-size: 1.1rem;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #1a3a5a;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        button:hover {
            background-color: #2a4a6a;
            transform: translateY(-2px);
        }
        button.active {
            background-color: #e67e22;
            box-shadow: 0 0 10px rgba(230, 126, 34, 0.5);
            font-weight: bold;
        }
        .table-container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 1px solid #ddd;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background-color: #1a3a5a;
            color: white;
            padding: 15px;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
            text-align: left;
        }
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            font-size: 15px;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover {
            background-color: #fdfdfd;
        }
        .pos-col { width: 60px; text-align: center; font-weight: bold; color: #888; }
        .team-logo {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 44px;
        }
        .team-icon { 
            width: 40px; 
            height: 40px; 
            display: block;
            object-fit: contain; 
        }
        .team-cell { 
            display: flex; 
            align-items: center; 
            gap: 14px; 
            min-width: 0;
        }
        .pts-col { width: 100px; text-align: center; font-weight: bold; color: #1a3a5a; font-size: 1.1rem; }
        .gp-col { width: 70px; text-align: center; color: #666; }
        .notice {
            max-width: 900px;
            width: 100%;
            box-sizing: border-box;
            margin-top: 15px;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        .notice.warning {
            background: #fdf3e3;
            border: 1px solid #e67e22;
            color: #9c5a12;
        }
        .notice.info {
            background: #eaf2f8;
            border: 1px solid #2a70a5;
            color: #1a4a6a;
        }
        .pending-table td, .pending-table th {
            font-size: 13px;
            padding: 8px 12px;
        }
        .pending-section {
            max-width: 900px;
            width: 100%;
            margin-top: 30px;
        }
        .pending-section h2 {
            color: #1a3a5a;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <h1>🏆 Respect Rank: La Liga</h1>
    <div class="description">
        Ranking football managers based on their respect for referees during post-game interviews.
    </div>

    <div class="controls">
        <button id="btn-separate" class="active" onclick="loadLeaderboard('separate')">Separate Mode</button>
        <button id="btn-competitive" onclick="loadLeaderboard('competitive')">Competitive Mode</button>
    </div>

    <div class="table-container">
        <table id="leaderboard-table">
            <thead>
                <tr>
                    <th class="pos-col">Pos</th>
                    <th class="team-cell">Coach & Team</th>
                    <th class="gp-col">GP</th>
                    <th class="pts-col">Points</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <!-- Data will be injected here -->
            </tbody>
        </table>
    </div>

    <div id="grading-notice" class="notice warning"></div>
    <div id="pending-summary" class="notice info"></div>

    <div class="pending-section" id="pending-section" style="display: none;">
        <h2>Pending collection (will be retried)</h2>
        <div class="table-container">
            <table class="pending-table">
                <thead>
                    <tr>
                        <th>Game</th>
                        <th>Date</th>
                        <th>Coach</th>
                        <th>Reason</th>
                        <th>Attempts</th>
                    </tr>
                </thead>
                <tbody id="pending-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadLeaderboard(mode) {
            try {
                const [leaderboardRes, teamsRes] = await Promise.all([
                    fetch(mode === 'separate' ? 'data/leaderboard.json' : 'data/leaderboard_competitive.json'),
                    fetch('data/teams.json')
                ]);
                
                const leaderboard = await leaderboardRes.json();
                const teams = await teamsRes.json();
                
                const body = document.getElementById('leaderboard-body');
                body.innerHTML = '';
                
                leaderboard.forEach((entry, index) => {
                    const coach = entry.coach;
                    const teamData = teams.find(t => t.coach === coach);
                    const teamName = teamData ? teamData.team : 'Unknown Team';
                    const prevCoach = teamData ? teamData.previous_coach : 'N/A';
                    const logoUrl = teamData ? teamData.logo : 'assets/teams/default.svg';
                    
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="pos-col">${index + 1}</td>
                        <td class="team-cell">
                            <div class="team-logo">
                                <img src="${logoUrl}" class="team-icon" alt="${teamName} logo" loading="lazy"
                                     onerror="this.onerror=null; this.src='assets/teams/default.svg';">
                            </div>
                            <div>
                                <div style="font-weight: bold;">${teamName}</div>
                                <div style="font-size: 0.8rem; color: #666;">${coach} <span style="font-style: italic; opacity: 0.8;">(Prev: ${prevCoach})</span></div>
                            </div>
                        </td>
                        <td class="gp-col">${entry.games_played}</td>
                        <td class="pts-col">${entry.points}</td>
                    `;
                    body.appendChild(row);
                });

                document.getElementById('btn-separate').classList.toggle('active', mode === 'separate');
                document.getElementById('btn-competitive').classList.toggle('active', mode === 'competitive');
            } catch (e) {
                console.error("Error loading data:", e);
            }
        }

        async function loadNotices() {
            // Heuristic-grading warning from comments.json
            try {
                const comments = await (await fetch('data/comments.json')).json();
                const heuristic = comments.filter(c => c.graded_by === 'heuristic').length;
                const llm = comments.filter(c => c.graded_by === 'llm').length;
                const notice = document.getElementById('grading-notice');
                if (heuristic > 0) {
                    notice.style.display = 'block';
                    notice.textContent = `Data quality: ${heuristic} of ${comments.length} quotes were graded by the low-confidence heuristic fallback (${llm} by LLM). Treat those scores with caution.`;
                }
            } catch (e) {
                console.warn("Could not load comments.json:", e);
            }

            // Pending collection requests
            try {
                const pending = await (await fetch('data/pending_requests.json')).json();
                const MAX_ATTEMPTS = 5;
                const active = pending.filter(p => (p.attempts || 0) < MAX_ATTEMPTS);
                const summary = document.getElementById('pending-summary');
                const section = document.getElementById('pending-section');
                const body = document.getElementById('pending-body');
                body.innerHTML = '';
                if (active.length > 0) {
                    summary.style.display = 'block';
                    summary.textContent = `Collection incomplete: ${active.length} coach/game pair(s) still pending and will be retried on the next run.`;
                    section.style.display = 'block';
                    active.forEach(p => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${p.game_id}</td>
                            <td>${p.date}</td>
                            <td>${p.coach}</td>
                            <td>${p.reason}</td>
                            <td>${p.attempts}</td>
                        `;
                        body.appendChild(row);
                    });
                }
            } catch (e) {
                console.warn("Could not load pending_requests.json:", e);
            }
        }

        window.onload = () => {
            loadLeaderboard('separate');
            loadNotices();
        };
    </script>
</body>
</html>
